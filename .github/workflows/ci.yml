name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            configure_args: -DCMAKE_C_COMPILER=gcc
            sanitizers: ON
          - os: ubuntu-latest
            configure_args: -DCMAKE_C_COMPILER=clang
            sanitizers: ON
          - os: ubuntu-latest
            configure_args: -DCMAKE_C_COMPILER=gcc
            sanitizers: OFF
          - os: windows-latest
            configure_args: ""
            sanitizers: OFF
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQVPLAY_SANITIZERS=${{ matrix.sanitizers }} ${{ matrix.configure_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
